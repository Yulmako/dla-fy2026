    definition_note: >
      Candidate working segment (added 2026-11-06), pending Phase 1 probe
      validation. Not an exhaustive definition of the defense logistics
      industry. Subsistence, fuel, pharmaceuticals and medical supply are
      scanned at review tier only because their volume would dominate the
      segment; aircraft/vehicle spare parts belong to other markets.
    included_tiers: [core, extended]
    agency_scope:
      basis: awarding
      toptier_agencies:
        - name: "Department of Defense"
      subtier_agencies:                      # awarding sub-agency filter
        - name: "Defense Logistics Agency"
      notes: "Awarding sub-agency = Defense Logistics Agency (decision 2026-11-06). Remove subtier_agencies for all of DoD."
    keywords:
      mode: tag_only
      terms: [logistics, warehouse, distribution, "prime vendor", "tailored logistics", "MRO", "special operational equipment", "kit"]
    naics_codes:
      - {code: "423840", tier: core,     label: "Industrial supplies merchant wholesalers", rationale: "MRO / industrial supply distribution."}
      - {code: "423830", tier: core,     label: "Industrial machinery & equipment merchant wholesalers", rationale: "Equipment distribution."}
      - {code: "423990", tier: core,     label: "Other miscellaneous durable goods merchant wholesalers", rationale: "Tactical / field equipment distribution."}
