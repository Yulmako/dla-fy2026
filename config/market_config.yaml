  logistics_supply:
    name: "Logistics & Supply"
    status: candidate
    description: >
      DoD prime contract obligations for supply and distribution of material
      (industrial/MRO supplies, hardware, tools, clothing and individual
      equipment, safety and field equipment, packaging) and for logistics
